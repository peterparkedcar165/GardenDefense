<title>Level 8 Wave 20</title>
<style>
  :root{
    --bg:#f8f7f4;
    --surface:#ffffff;
    --text-primary:#161511;
    --text-secondary:#5c594f;
    --text-muted:#948f80;
    --border:#e5e2d9;
    --grid:#e5e2d9;
    --bar:#2a78d6;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#121210;
      --surface:#1b1a16;
      --text-primary:#f3f1ea;
      --text-secondary:#bdb8a8;
      --text-muted:#857f6e;
      --border:#2d2b25;
      --grid:#2d2b25;
      --bar:#4f93e8;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#121210;
    --surface:#1b1a16;
    --text-primary:#f3f1ea;
    --text-secondary:#bdb8a8;
    --text-muted:#857f6e;
    --border:#2d2b25;
    --grid:#2d2b25;
    --bar:#4f93e8;
    color-scheme:dark;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text-primary);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    padding:28px 16px 40px;
  }
  .wrap{ max-width:620px; margin:0 auto; display:flex; flex-direction:column; gap:18px; }
  h1{ font-size:1.25rem; font-weight:700; margin:0 0 2px; }
  p.sub{ font-size:0.85rem; color:var(--text-secondary); margin:0; }
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:20px 20px 14px;
  }
  .rows{ display:flex; flex-direction:column; gap:12px; }
  .row{ display:grid; grid-template-columns:90px 1fr 36px; align-items:center; gap:10px; }
  .row .name{ font-size:0.86rem; color:var(--text-secondary); }
  .track{ position:relative; height:18px; background:var(--grid); border-radius:5px; overflow:hidden; }
  .fill{ position:absolute; top:0; left:0; height:100%; background:var(--bar); border-radius:5px; }
  .val{ font-size:0.86rem; font-weight:650; text-align:right; font-variant-numeric:tabular-nums; }
  .foot{ font-size:0.76rem; color:var(--text-muted); margin-top:4px; }
</style>

<div class="wrap">
  <div>
    <h1>Level 8 — Wave 20</h1>
    <p class="sub">Final wave spawn composition, 113.46s total wave duration.</p>
  </div>
  <div class="card">
    <div class="rows" id="rows"></div>
    <div class="foot">343 total insects across 7 species.</div>
  </div>
</div>

<script>
  var data = [
    {name: "Scout Ant", count: 110},
    {name: "Soldier Ant", count: 63},
    {name: "Worker Ant", count: 73},
    {name: "Moth", count: 41},
    {name: "Firefly", count: 39},
    {name: "Mosquito", count: 10},
    {name: "Snail", count: 7}
  ];
  data.sort(function(a, b){ return b.count - a.count; });
  var max = Math.max.apply(null, data.map(function(d){ return d.count; }));

  var rows = document.getElementById("rows");
  data.forEach(function(d){
    var row = document.createElement("div");
    row.className = "row";

    var name = document.createElement("div");
    name.className = "name";
    name.textContent = d.name;

    var track = document.createElement("div");
    track.className = "track";
    var fill = document.createElement("div");
    fill.className = "fill";
    fill.style.width = (d.count / max * 100) + "%";
    track.appendChild(fill);

    var val = document.createElement("div");
    val.className = "val";
    val.textContent = d.count;

    row.appendChild(name);
    row.appendChild(track);
    row.appendChild(val);
    rows.appendChild(row);
  });
</script>
